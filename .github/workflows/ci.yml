name: CI Workflow
on:
  push:
    branches: [main]
    paths: ["MLProject/**", ".github/workflows/ci.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train-and-push:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: pip install mlflow==2.19.0 numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 matplotlib

      - name: Run mlflow project
        run: mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(ls -t mlruns/0 | grep -E '^[0-9a-f]{32}$' | head -1)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Run ID: $RUN_ID"

      - name: Install Python dependencies
        run: pip install --upgrade pip setuptools wheel

      - name: Upload to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add mlruns
          git commit -m "Add MLflow artifacts run ${{ env.RUN_ID }}" || echo "no changes"
          git push

      - name: Build Docker Model
        run: mlflow models build-docker -m "mlruns/0/${{ env.RUN_ID }}/artifacts/model" -n telco-churn-model

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: docker tag telco-churn-model ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model:latest

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/telco-churn-model:latest